<!doctype html>
<html lang="en" style="background-color: #030712;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Taskpass</title>
    <meta name="description" content="An interactive React Native simulator and code composer showcasing a unified iOS & Android TaskPass scheduler with rich drag-and-drop mechanics." />
    <meta property="og:title" content="Taskpass" />
    <meta property="og:description" content="An interactive React Native simulator and code composer showcasing a unified iOS & Android TaskPass scheduler with rich drag-and-drop mechanics." />
    <script>
      // Suppress benign Vite dev client WebSocket errors in the iframe / proxy preview environment & React HMR dev warnings
      (function() {
        try {
          const origConsoleError = console.error;
          console.error = function(...args) {
            const str = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.stack || JSON.stringify(a)) : String(a))).join(' ');
            if (str.includes('Expected static flag was missing') || str.includes('WebSocket') || str.includes('@vite/client')) {
              return;
            }
            origConsoleError.apply(console, args);
          };
          const origConsoleWarn = console.warn;
          console.warn = function(...args) {
            const str = args.map(a => String(a)).join(' ');
            if (str.includes('Expected static flag was missing') || str.includes('WebSocket')) {
              return;
            }
            origConsoleWarn.apply(console, args);
          };
        } catch (_) {}

        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event?.reason?.message || event?.reason?.stack || event?.reason || '');
          if (
            reasonStr.includes('WebSocket closed without opened') ||
            reasonStr.includes('WebSocket') ||
            reasonStr.includes('@vite/client') ||
            reasonStr.includes('Expected static flag was missing')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = String(event?.message || event?.error?.message || event?.error?.stack || '');
          const filename = String(event?.filename || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('@vite/client') ||
            msg.includes('Expected static flag was missing') ||
            filename.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
  </head>
  <body style="background-color: #030712; margin: 0; padding: 0;">
    <div id="root"></div>
    <script>
      // Completely prevent iOS / mobile auto-zoom and gesture zooming
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      }, { passive: false });

      // Prevent double-tap to zoom while preserving normal input focus
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          const target = event.target;
          if (target && !['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)) {
            event.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
